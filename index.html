<html lang="zh"><head><meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>但丁七宗罪 · 艺术人格确诊</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, html {
    font-family: "STZhongsong", "华文中宋", "SimSun", "Songti SC", serif;
    background: #0a0508;
    color: #fff;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .fullscreen {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }
  .bg-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  .bg-layer img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    filter: brightness(0.7) contrast(1.1);
  }
  .bg-layer::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      135deg,
      rgba(10, 5, 8, 0.85) 0%,
      rgba(10, 5, 8, 0.3) 40%,
      rgba(10, 5, 8, 0.7) 100%
    );
  }

  .intro-text {
    position: absolute;
    top: 8vh;
    left: 8vw;
    z-index: 2;
    max-width: 80vw;
    animation: fadeIn 1s ease;
  }
  .intro-text .quote {
    font-size: clamp(24px, 5vw, 42px);
    font-weight: 700;
    color: #e8d5b5;
    line-height: 1.4;
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
    margin-bottom: 12px;
  }
  .intro-text .sub {
    font-size: clamp(14px, 2.5vw, 20px);
    color: #c9b8d9;
    letter-spacing: 2px;
    opacity: 0.9;
    text-shadow: 0 0 10px rgba(0,0,0,0.8);
  }

  .start-wrap {
    position: absolute;
    bottom: 8vh;
    left: 8vw;
    z-index: 2;
    animation: fadeIn 1.2s ease 0.3s both;
  }
  .start-btn {
    display: inline-block;
    padding: 14px 44px;
    background: transparent;
    border: 1px solid rgba(232, 213, 181, 0.6);
    color: #e8d5b5;
    font-family: inherit;
    font-size: clamp(15px, 2vw, 18px);
    letter-spacing: 4px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .start-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(233, 69, 96, 0.15);
    transform: translateX(-100%);
    transition: transform 0.4s ease;
    z-index: -1;
  }
  .start-btn:hover {
    border-color: #e94560;
    color: #fff;
    box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
  }
  .start-btn:hover::before {
    transform: translateX(0);
  }

  #questionBox {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: none;
    flex-direction: column;
    justify-content: center;
    padding: 8vw;
    background: rgba(10, 5, 8, 0.88);
    backdrop-filter: blur(6px);
  }
  .q-header {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #8a7a9a;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  .progress-bar {
    height: 2px;
    background: rgba(255,255,255,0.1);
    margin-bottom: 40px;
    overflow: hidden;
  }
  .progress {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #e94560, #f5d9a8);
    transition: width 0.4s ease;
  }
  .question {
    font-size: clamp(18px, 3.5vw, 26px);
    line-height: 1.7;
    color: #e8d5b5;
    margin-bottom: 36px;
    min-height: 80px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 600px;
  }
  .option {
    padding: 18px 24px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(232, 213, 181, 0.2);
    color: #d6cce6;
    font-family: inherit;
    font-size: clamp(15px, 2vw, 17px);
    line-height: 1.6;
    cursor: pointer;
    transition: all 0.25s ease;
    letter-spacing: 1px;
  }
  .option:hover {
    background: rgba(233, 69, 96, 0.15);
    border-color: rgba(233, 69, 96, 0.6);
    color: #fff;
    transform: translateX(6px);
  }

  #result {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 5vh 8vw;
    background: rgba(10, 5, 8, 0.92);
    backdrop-filter: blur(10px);
    overflow-y: auto;
  }
  .result-inner {
    max-width: 480px;
    width: 100%;
    text-align: center;
    animation: fadeIn 0.8s ease;
  }
  .emblem-wrap {
    position: relative;
    width: 150px;
    height: 150px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .emblem-wrap::before {
    content: ""; position: absolute; inset: 0;
    border-radius: 50%; filter: blur(30px); opacity: 0.5; z-index: 0;
  }
  .emblem-wrap svg { position: relative; z-index: 1; width: 100%; height: 100%; }
  .emblem-wrap[data-type="superbia"]::before { background: radial-gradient(circle, #e8b04b, transparent 70%); }
  .emblem-wrap[data-type="invidia"]::before { background: radial-gradient(circle, #6ec04a, transparent 70%); }
  .emblem-wrap[data-type="ira"]::before { background: radial-gradient(circle, #ff5722, transparent 70%); }
  .emblem-wrap[data-type="acedia"]::before { background: radial-gradient(circle, #8fa8b8, transparent 70%); }
  .emblem-wrap[data-type="avaritia"]::before { background: radial-gradient(circle, #e8c060, transparent 70%); }
  .emblem-wrap[data-type="gula"]::before { background: radial-gradient(circle, #ff8c42, transparent 70%); }
  .emblem-wrap[data-type="luxuria"]::before { background: radial-gradient(circle, #e878b0, transparent 70%); }

  .result-label {
    font-size: 12px; color: #8a7a9a; letter-spacing: 4px;
    margin-bottom: 10px;
  }
  .diagnosis {
    display: inline-block;
    font-size: 13px; color: #e94560; letter-spacing: 3px;
    padding: 5px 18px;
    border: 1px solid rgba(233,69,96,0.6);
    margin-bottom: 16px;
    font-family: inherit;
  }
  .type {
    font-size: clamp(24px, 5vw, 36px);
    font-weight: 700; color: #f5d9a8;
    letter-spacing: 2px; margin-bottom: 8px;
  }
  .latin {
    font-size: 13px; color: #a890b8; margin-bottom: 24px;
    letter-spacing: 2px; font-style: italic;
  }
  .desc {
    font-size: clamp(14px, 2vw, 16px);
    line-height: 1.9;
    color: #d6cce6;
    margin-bottom: 30px;
    text-align: left;
    padding: 0 10px;
  }
  .desc p { margin-bottom: 12px; }
  .btn-row { display: flex; gap: 16px; justify-content: center; margin-bottom: 20px; }
  .restart, .share {
    padding: 12px 30px;
    border: 1px solid rgba(232, 213, 181, 0.4);
    background: transparent;
    color: #e8d5b5;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .restart:hover, .share:hover {
    background: rgba(233, 69, 96, 0.2);
    border-color: #e94560;
    color: #fff;
  }
  .footer {
    text-align: center; font-size: 11px; color: #5a4a6a;
    letter-spacing: 2px; margin-top: 10px;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>

let current = 0;
let scores = { superbia:0, invidia:0, ira:0, acedia:0, avaritia:0, gula:0, luxuria:0 };

function startQuiz() {
  document.getElementById("intro").style.display = "none";
  document.getElementById("questionBox").style.display = "flex";
  render();
}

function render() {
  if (current >= questions.length) { showResult(); return; }
  const q = questions[current];
  document.getElementById("question").textContent = q.q;
  document.getElementById("counter").textContent = (current + 1) + " / " + questions.length;
  const optBox = document.getElementById("options");
  optBox.innerHTML = "";
  [q.a, q.b].forEach(opt => {
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt.text;
    div.onclick = () => {
      scores[opt.dim]++;
      current++;
      updateProgress();
      render();
    };
    optBox.appendChild(div);
  });
  updateProgress();
}

function updateProgress() {
  const p = (current / questions.length) * 100;
  document.getElementById("progress").style.width = p + "%";
}

function showResult() {
  document.getElementById("questionBox").style.display = "none";
  document.getElementById("result").style.display = "flex";

  let maxKey = "superbia", maxVal = -1;
  for (const k in scores) {
    if (scores[k] > maxVal) { maxVal = scores[k]; maxKey = k; }
  }
  const r = results[maxKey];
  const wrap = document.getElementById("emblemWrap");
  wrap.setAttribute("data-type", maxKey);
  wrap.innerHTML = r.svg;
  document.getElementById("type").textContent = r.name;
  document.getElementById("latin").textContent = r.latin;
  document.getElementById("desc").innerHTML = r.desc.split("\n\n").map(p => `<p>${p}</p>`).join("");
  window._resultName = r.name;
  window._resultLatin = r.latin;
}

function shareResult() {
  const text = `【确诊结果】我是「${window._resultName}」——${window._resultLatin}。\n但丁炼狱七层，你确诊在哪一层？`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(
      () => alert("确诊单已复制！去朋友圈发一下吧 🏥"),
      () => prompt("复制以下文案分享：", text)
    );
  } else {
    prompt("复制以下文案分享：", text);
  }
}
